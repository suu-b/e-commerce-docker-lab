[project]
name = "shop-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suu-b", email = "thakur0805@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "psycopg[binary]>=3.3.8",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
shop-api = "shop_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "database",
]
