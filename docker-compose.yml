services:
  db:
    image: postgres:17-alpine
    container_name: shop-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SHOP_DB}
      POSTGRES_USER: ${SHOP_DB_SERVICE_ROLE}
      POSTGRES_PASSWORD: ${SHOP_DB_SERVICE_PWD}

    ports:
      - "5002:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${SHOP_DB_SERVICE_ROLE} -d ${SHOP_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    
  shop_db_migrate:
    build:
      context: ./database

    container_name: shop-db-migrate
    restart: "no"

    environment:
      SHOP_DB_URL: postgresql://${SHOP_DB_SERVICE_ROLE}:${SHOP_DB_SERVICE_PWD}@db:5432/${SHOP_DB}
      SHOP_DB_USER_PASSWORD: ${SHOP_DB_USER_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - shop-network

  shop-api:
    build:
      context: ./shop-api

    container_name: shop-api
    restart: unless-stopped

    environment:
      SHOP_DB_URL: postgresql://shop_db_user:${SHOP_DB_USER_PASSWORD}@db:5432/${SHOP_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

    ports:
      - "5000:5000"

    depends_on:
      shop_db_migrate:
        condition: service_completed_successfully

    networks:
      - shop-network

  storefront:
    build:
      context: ./storefront

    container_name: shop-storefront
    restart: unless-stopped

    environment:
      VITE_API_BASE_URL: 

    ports:
      - "5001:5173"

    depends_on:
      - shop-api

    networks:
      - shop-network

  nginx:
    image: nginx:alpine
    container_name: shop-nginx
    restart: unless-stopped

    ports: 
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - storefront
      - shop-api

    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge

volumes:
  postgres_data:
